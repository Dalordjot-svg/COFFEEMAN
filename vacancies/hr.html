<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COFFEEMAN • HR</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:#122247;font:16px system-ui,sans-serif}main{max-width:760px;margin:auto;padding:28px 18px 60px}header{position:relative;overflow:hidden;background:white;border-radius:32px;padding:32px;margin-bottom:20px;box-shadow:0 12px 50px #173a7510}header:after{content:'';position:absolute;right:-55px;top:-65px;width:210px;height:210px;border:20px solid #1464ff;border-radius:50%;opacity:.13;pointer-events:none}h1{font-size:clamp(32px,6vw,52px);line-height:1.04;margin:16px 0}h2{font-size:22px}p{line-height:1.6;color:#536581}small{color:#536581}.brand{font-weight:900;letter-spacing:2px;color:#0759f5}.card{background:white;border-radius:24px;padding:24px;margin:16px 0;box-shadow:0 8px 30px #173a750b}label{display:block;font-weight:650;margin:18px 0 6px}input,select,textarea{width:100%;font:inherit;border:1px solid #cbd6e8;border-radius:13px;padding:13px;background:#f9fbff;color:#122247}input[type=checkbox]{width:auto}button{border:0;background:linear-gradient(135deg,#39a5ff,#0759f5);color:white;padding:15px 20px;border-radius:15px;font:inherit;font-weight:750;cursor:pointer;margin-top:12px}button:focus-visible,input:focus-visible{outline:3px solid #80b8ff}button.secondary{background:#e8f1ff;color:#0759f5}.note{border-left:4px solid #1464ff;padding:12px 16px;background:#edf5ff;border-radius:12px}.hero{float:right;width:100px;height:100px;margin:0 0 10px 12px} [hidden]{display:none!important}@media print{body{background:white}main{max-width:none;padding:0}button,.noprint{display:none!important}.card,header{box-shadow:none;border:1px solid #dce5f3;break-inside:avoid}header:after{display:none}}</style></head><body><main><header><svg class="hero" viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#55ccff"/><stop offset="1" stop-color="#0759f5"/></linearGradient></defs><rect x="14" y="15" width="92" height="90" rx="29" fill="url(#b)"/><circle cx="60" cy="50" r="25" fill="#fff"/><path d="M37 44q22-30 47 0" fill="#0749cf"/><circle cx="51" cy="51" r="3" fill="#122247"/><circle cx="69" cy="51" r="3" fill="#122247"/><path d="M53 62q7 6 14 0" fill="none" stroke="#0759f5" stroke-width="3"/><path d="M27 105q3-31 33-31t33 31" fill="#d8efff"/><path d="M43 78v27m34-27v27" stroke="#0759f5" stroke-width="8"/></svg><div class="brand">COFFEEMAN / HR STUDIO</div><h1>Знакомимся<br>с будущей командой.</h1><p class="noprint">Просмотр тестовых анкет и печать красивого PDF.</p></header><section class="card noprint"><div class="note">Локальная демонстрация: нет сервера, авторизации и общего хранилища. Используй только вымышленные анкеты. Файлы не загружаются в интернет.</div><label for="import">Импортировать тестовую анкету JSON</label><input id="import" type="file" accept=".json,application/json" multiple><label for="search">Поиск по имени</label><input id="search" placeholder="Имя кандидата"><div id="list"></div><p id="status" role="status"></p></section><section class="card" id="detail" hidden><div class="brand">АНКЕТА СОИСКАТЕЛЯ</div><h2 id="title"></h2><div id="fields"></div><div class="noprint"><button id="attachment" hidden>Скачать тестовое согласие</button><button id="print">Сохранить в PDF / печать</button></div></section></main><script>const apps=[];let current;const el=id=>document.getElementById(id);const labels={name:'Имя',age:'Возраст',role:'Вакансия',city:'Город / район',contact:'Контакт',study:'Учится',school:'Место учёбы',schedule:'График',experience:'Опыт',parent:'Позиция родителей',createdAt:'Дата анкеты'};function show(a){current=a;el('detail').hidden=false;el('title').textContent=String(a.name||'Анкета');el('fields').replaceChildren();for(const [k,v] of Object.entries(labels)){if(a[k]==null)continue;const row=document.createElement('p'),strong=document.createElement('strong');strong.textContent=v+': ';row.append(strong,document.createTextNode(String(a[k])));el('fields').append(row);}el('attachment').hidden=!a.attachment;}function render(){el('list').replaceChildren();for(const a of apps.filter(a=>String(a.name).toLowerCase().includes(el('search').value.toLowerCase()))){const b=document.createElement('button');b.className='secondary';b.textContent=a.name+' · '+a.role;b.onclick=()=>show(a);el('list').append(b,document.createElement('br'));}}el('search').oninput=render;el('import').onchange=async e=>{let count=0;for(const f of e.target.files){try{if(f.size>3500000)throw Error();const a=JSON.parse(await f.text());if(!a||typeof a.name!=='string'||typeof a.role!=='string')throw Error();apps.push(a);count++;}catch{}}el('status').textContent='Импортировано: '+count;render();if(count)show(apps.at(-1));};el('print').onclick=()=>window.print();el('attachment').onclick=()=>{const a=current?.attachment;if(!a||typeof a.data!=='string'||!/^data:(application\/pdf|image\/jpeg|image\/png);base64,[A-Za-z0-9+/=]+$/.test(a.data))return;const link=document.createElement('a');link.href=a.data;link.download=String(a.name||'consent');link.click();};</script></body></html>
