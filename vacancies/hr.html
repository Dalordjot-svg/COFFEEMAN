<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COFFEEMAN • HR</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:#122247;font:16px system-ui,sans-serif}main{max-width:760px;margin:auto;padding:28px 18px 60px}header{position:relative;overflow:hidden;background:white;border-radius:32px;padding:32px;margin-bottom:20px;box-shadow:0 12px 50px #173a7510}header:after{content:'';position:absolute;right:-55px;top:-65px;width:210px;height:210px;border:20px solid #1464ff;border-radius:50%;opacity:.13;pointer-events:none}h1{font-size:clamp(32px,6vw,52px);line-height:1.04;margin:16px 0}h2{font-size:22px}p{line-height:1.6;color:#536581}small{color:#536581}.brand{font-weight:900;letter-spacing:2px;color:#0759f5}.card{background:white;border-radius:24px;padding:24px;margin:16px 0;box-shadow:0 8px 30px #173a750b}label{display:block;font-weight:650;margin:18px 0 6px}input,select,textarea{width:100%;font:inherit;border:1px solid #cbd6e8;border-radius:13px;padding:13px;background:#f9fbff;color:#122247}input[type=checkbox]{width:auto}button{border:0;background:linear-gradient(135deg,#39a5ff,#0759f5);color:white;padding:15px 20px;border-radius:15px;font:inherit;font-weight:750;cursor:pointer;margin-top:12px}button:focus-visible,input:focus-visible{outline:3px solid #80b8ff}button.secondary{background:#e8f1ff;color:#0759f5}.note{border-left:4px solid #1464ff;padding:12px 16px;background:#edf5ff;border-radius:12px}.hero{float:right;width:100px;height:100px;margin:0 0 10px 12px} [hidden]{display:none!important}@media print{body{background:white}main{max-width:none;padding:0}button,.noprint{display:none!important}.card,header{box-shadow:none;border:1px solid #dce5f3;break-inside:avoid}header:after{display:none}}body{background:#f6f9ff}header{min-height:240px;background:linear-gradient(125deg,#fff 55%,#e0efff)}.hero{width:clamp(100px,25vw,170px);height:auto;filter:drop-shadow(0 12px 12px #0759f533);animation:float 3s ease-in-out infinite} @keyframes float{50%{transform:translateY(-9px) rotate(3deg)}}.card{border:1px solid #e6edf9}button{transition:transform .15s}button:active{transform:scale(.97)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:white;border:1px solid #dce8fa;border-radius:20px;padding:14px;text-align:left;color:#122247;margin:0}.stat b{display:block;font-size:26px;color:#0759f5}.stat small{font-size:12px}.appRow{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #e5edf8;padding:12px 0}.appRow button{margin:0;text-align:left}.tag{border-radius:20px;padding:6px 10px;background:#edf3ff;font-size:12px;white-space:nowrap}.tag[data-state="Одобрена"]{background:#e2f7ea;color:#176b3e}.tag[data-state="Отклонена"]{background:#ffebed;color:#982738}.actions{display:flex;flex-wrap:wrap;gap:8px}.approve{background:#16804b}.reject{background:#b7364c}.scene{height:5px;border-radius:9px;background:#e3edff;overflow:hidden;margin-top:24px}.scene:before{content:'';display:block;width:40%;height:100%;background:linear-gradient(90deg,#72d8ff,#0759f5);animation:sweep 3s ease-in-out infinite}@keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}@media(max-width:540px){.stats{grid-template-columns:repeat(2,1fr)}header{padding:24px;min-height:190px}.appRow{flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media print{.scene,.stats{display:none!important}.hero{animation:none}}</style></head><body><main><header><svg class="hero" viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#55ccff"/><stop offset="1" stop-color="#0759f5"/></linearGradient></defs><rect x="14" y="15" width="92" height="90" rx="29" fill="url(#b)"/><circle cx="60" cy="50" r="25" fill="#fff"/><path d="M37 44q22-30 47 0" fill="#0749cf"/><circle cx="51" cy="51" r="3" fill="#122247"/><circle cx="69" cy="51" r="3" fill="#122247"/><path d="M53 62q7 6 14 0" fill="none" stroke="#0759f5" stroke-width="3"/><path d="M27 105q3-31 33-31t33 31" fill="#d8efff"/><path d="M43 78v27m34-27v27" stroke="#0759f5" stroke-width="8"/></svg><div class="brand">COFFEEMAN / HR STUDIO</div><h1>Знакомимся<br>с будущей командой.</h1><p class="noprint">Просмотр тестовых анкет и печать красивого PDF.</p><div class="scene" aria-hidden="true"></div></header><section class="card noprint" id="login"><h2>Вход в HR Studio</h2><p>Демонстрационный код доступа</p><form id="pinForm"><label for="pin">Код</label><input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="5" required><button>Войти</button><p id="pinError" role="status"></p></form></section><div id="workspace" hidden><div class="stats noprint" id="stats"></div><button class="secondary noprint" id="logout">Выйти</button><section class="card noprint"><div class="note">Демо • код не защищает данные на сервере. Только вымышленные анкеты. Заявки доступны в одном браузере или через импорт JSON.</div><label for="import">Импортировать тестовую анкету JSON</label><input id="import" type="file" accept=".json,application/json" multiple><label for="search">Поиск по имени</label><input id="search" placeholder="Имя кандидата"><label for="filter">Статус</label><select id="filter"><option>Все</option><option>Новая</option><option>Одобрена</option><option>Отклонена</option></select><div id="list"></div><p id="status" role="status"></p></section><section class="card" id="detail" hidden><div class="brand">АНКЕТА СОИСКАТЕЛЯ</div><h2 id="title"></h2><p id="decision"></p><div id="fields"></div><div class="actions noprint"><button class="approve" id="approve">Одобрить</button><button class="reject" id="reject">Отклонить</button><button class="secondary" id="reset">Вернуть в новые</button></div><div class="noprint"><button id="attachment" hidden>Скачать тестовое согласие</button><button id="print">Сохранить в PDF / печать</button></div></section></div></main><script>
const KEY='coffeeman.vacancies.demo.v2', el=id=>document.getElementById(id);let apps=[],current=null;const states=['Новая','Одобрена','Отклонена'];const labels={name:'Имя',age:'Возраст',role:'Вакансия',city:'Город / район',contact:'Контакт',study:'Учится',school:'Место учёбы',schedule:'График',experience:'Опыт',about:'О себе',parent:'Позиция родителей',createdAt:'Дата анкеты'};function load(){try{const a=JSON.parse(localStorage.getItem(KEY)||'[]');apps=Array.isArray(a)?a:[]}catch{apps=[]}}function persist(){try{localStorage.setItem(KEY,JSON.stringify(apps));return true}catch{el('status').textContent='Не удалось сохранить изменения в браузере.';return false}}function state(a){return states.includes(a.status)?a.status:'Новая'}function show(a){current=a;el('detail').hidden=false;el('title').textContent=String(a.name||'Анкета');el('decision').textContent='Статус: '+state(a);el('fields').replaceChildren();for(const [k,v] of Object.entries(labels)){if(a[k]==null)continue;const row=document.createElement('p'),strong=document.createElement('strong');strong.textContent=v+': ';row.append(strong,document.createTextNode(String(a[k])));el('fields').append(row)}el('attachment').hidden=!a.attachment;}function render(){el('stats').replaceChildren();for(const s of ['Все',...states]){const b=document.createElement('button');b.className='stat';const n=document.createElement('b'),t=document.createElement('small');n.textContent=s==='Все'?apps.length:apps.filter(a=>state(a)===s).length;t.textContent=s;b.append(n,t);b.onclick=()=>{el('filter').value=s;render()};el('stats').append(b)}el('list').replaceChildren();const q=el('search').value.toLowerCase(),filter=el('filter').value;const filtered=apps.filter(a=>(String(a.name)+' '+String(a.role)).toLowerCase().includes(q)&&(filter==='Все'||state(a)===filter));for(const a of filtered){const row=document.createElement('div'),b=document.createElement('button'),tag=document.createElement('span');row.className='appRow';b.className='secondary';b.textContent=a.name+' · '+a.role;b.onclick=()=>show(a);tag.className='tag';tag.dataset.state=state(a);tag.textContent=state(a);row.append(b,tag);el('list').append(row)}if(!filtered.length)el('list').textContent='Заявок пока нет.'}function change(s){if(!current)return;current.status=s;persist();show(current);render()}el('approve').onclick=()=>change('Одобрена');el('reject').onclick=()=>change('Отклонена');el('reset').onclick=()=>change('Новая');el('search').oninput=el('filter').onchange=render;el('pinForm').onsubmit=e=>{e.preventDefault();if(el('pin').value.replace(/\s/g,'')!=='0506'){el('pinError').textContent='Неверный код';return}el('login').hidden=true;el('workspace').hidden=false;el('pin').value='';el('pinError').textContent='';load();render()};el('logout').onclick=()=>{current=null;apps=[];el('detail').hidden=true;el('fields').replaceChildren();el('list').replaceChildren();el('workspace').hidden=true;el('login').hidden=false};window.addEventListener('storage',e=>{if(e.key===KEY&&!el('workspace').hidden){const id=current?.id;load();render();const a=apps.find(x=>x.id===id);if(a)show(a);else el('detail').hidden=true}});el('import').onchange=async e=>{let count=0;for(const f of e.target.files){try{if(f.size>3500000)throw Error();const a=JSON.parse(await f.text());if(!a||typeof a.name!=='string'||typeof a.role!=='string')throw Error();a.id=typeof a.id==='string'?a.id:crypto.randomUUID();if(apps.some(x=>x.id===a.id))continue;a.status=state(a);apps.push(a);count++}catch{}}if(persist())el('status').textContent='Импортировано: '+count;render();if(count)show(apps.at(-1))};el('print').onclick=()=>window.print();el('attachment').onclick=()=>{const a=current?.attachment;if(!a||typeof a.data!=='string'||!/^data:(application\/pdf|image\/jpeg|image\/png);base64,[A-Za-z0-9+/=]+$/.test(a.data))return;const link=document.createElement('a');link.href=a.data;link.download=String(a.name||'consent');link.click()};
</script><script type="module">import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';import {getDatabase,ref,onValue,set,update,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js';import {getAuth,signInAnonymously,signInWithEmailAndPassword,signOut,setPersistence,inMemoryPersistence} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';

// The global database rules must not grant broad ancestor read/write permissions.
const net=document.createElement('p');net.className='note noprint';net.textContent='Firebase: проверяем подключение…';document.querySelector('header').after(net);onValue(ref(db,'.info/connected'),s=>{net.textContent=(s.val()?'Firebase: соединение установлено':'Firebase: нет соединения')+(live?'':' · приём реальных анкет отключён до настройки защиты');});
if(live){await setPersistence(auth,inMemoryPersistence);const form=document.querySelector('#pinForm');form.innerHTML='<label for="hrEmail">Email сотрудника HR</label><input id="hrEmail" type="email" required autocomplete="username"><label for="hrPassword">Пароль</label><input id="hrPassword" type="password" required autocomplete="current-password"><button>Войти</button><p id="pinError" role="status"></p>';let unsub;el('import').closest('section').querySelector('.note').textContent='Заявки из Realtime Database. Доступ только сотрудникам с ролью HR.';el('import').hidden=true;el('import').previousElementSibling.hidden=true;form.onsubmit=async e=>{e.preventDefault();try{const user=(await signInWithEmailAndPassword(auth,el('hrEmail').value,el('hrPassword').value)).user;const token=await user.getIdTokenResult(true);if(token.claims.hr!==true){await signOut(auth);throw Error('Нет роли HR');}el('login').hidden=true;el('workspace').hidden=false;el('hrPassword').value='';unsub=onValue(ref(db,root),snap=>{const id=current?.id;apps=Object.entries(snap.val()||{}).map(([id,a])=>({...a,id}));render();if(id){const a=apps.find(x=>x.id===id);if(a)show(a);else{current=null;el('detail').hidden=true;}}},err=>{el('status').textContent='Нет доступа к заявкам: '+err.message;});}catch(err){el('pinError').textContent=err.message;}};async function decide(s){if(!current)return;try{await update(ref(db,root+'/'+current.id),{status:s,updatedAt:serverTimestamp()});}catch(err){el('status').textContent='Не удалось изменить статус: '+err.message;}}el('approve').onclick=()=>decide('Одобрена');el('reject').onclick=()=>decide('Отклонена');el('reset').onclick=()=>decide('Новая');el('logout').onclick=async()=>{unsub?.();await signOut(auth);apps=[];current=null;el('fields').replaceChildren();el('list').replaceChildren();el('detail').hidden=true;el('workspace').hidden=true;el('login').hidden=false;};}
